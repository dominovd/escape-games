<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escape Kit Player</title>
<link rel="stylesheet" href="engine/player.css">
<style>html,body{margin:0;height:100%;background:#090b1a}#game{height:100svh}</style>
</head>
<body>
<div id="game"></div>
<script type="module">
import { mountPlayer } from './engine/player.js';
// play.html?game=games/castle  (folder that contains game.json)
const dir = (new URLSearchParams(location.search).get('game') || 'games/castle').replace(/\/$/, '');
const root = document.getElementById('game');
try {
  const game = await fetch(dir + '/game.json', { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error(r.status + ' ' + dir + '/game.json'); return r.json(); });
  document.title = game.title || game.id;
  mountPlayer(root, game, { asset: p => dir + '/' + p, debug: new URLSearchParams(location.search).has('debug') });
} catch (e) {
  root.innerHTML = `<p style="color:#ff8a7a;font:16px system-ui;padding:40px">Could not load game: ${e.message}</p>`;
}
</script>
</body>
</html>
